<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trattoria da Mario</title>
  <style>
    *{box-sizing:border-box} body{font-family:system-ui;margin:0;padding:16px;max-width:100%}
    img,form,div{max-width:100%}
    label{display:block;margin:.5rem 0 .2rem} input,textarea{width:100%;padding:.5rem}
    button{margin-top:1rem;padding:.6rem 1rem}
  </style>
</head>
<body>
  <h1>Trattoria da Mario</h1>
  <p>Cucina tradizionale. Menù del giorno.</p>
  <form id="f">
    <label for="nome">Nome</label><input id="nome" name="nome" />
    <label for="email">Email</label><input id="email" name="email" type="email" />
    <label for="messaggio">Messaggio</label><textarea id="messaggio" name="messaggio"></textarea>
    <button type="submit">Invia</button>
  </form>
  <p id="ok" style="display:none">Grazie! Ti ricontattiamo presto.</p>
  <script>
    document.getElementById('f').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('ok').style.display = 'block';
    });
  </script>
</body>
</html>
