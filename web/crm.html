<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Brik · CRM prospect</title>
<style>
  :root{
    --bg:#0a0c12; --bg-2:#0e111a; --panel:#12141d; --line:rgba(255,255,255,.09);
    --ink:#eef1f7; --ink-2:#9aa3b2; --ink-3:#5e7184; --accent:#7c8cff; --accent-2:#5b5bf0;
    --ok:#3ecf8e; --warn:#f5b95c; --bad:#ff6b6b; --info:#5b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(10,12,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sp{flex:1}
  .muted{color:var(--ink-2)}
  .pill{font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:4px 10px}
  input,select,textarea,button{font:inherit;color:var(--ink)}
  input[type=text],input[type=search],input[type=date],select,textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .search{min-width:220px}
  .toolbar{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .wrap{padding:0 12px 60px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:57px;background:var(--bg-2);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
  thead th.no-sort{cursor:default}
  tbody td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  tr.off{opacity:.5}
  .name{font-weight:600}
  .sub{color:var(--ink-3);font-size:12px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  select.status{border-radius:100px;padding:5px 8px;font-size:12px;font-weight:600}
  .st-da_contattare{color:var(--ink-2)}
  .st-contattato{color:var(--info)}
  .st-interessato{color:var(--warn)}
  .st-venduto{color:var(--ok)}
  .st-non_contattare{color:var(--bad);font-weight:800}
  .st-scaduto{color:var(--bad)}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;white-space:nowrap}
  .badge.exp{background:rgba(255,107,107,.14);color:var(--bad);border:1px solid rgba(255,107,107,.35)}
  .badge.spento{background:rgba(255,255,255,.06);color:var(--ink-2);border:1px solid var(--line)}
  .badge.wa{background:rgba(62,207,142,.14);color:var(--ok);border:1px solid rgba(62,207,142,.35)}
  a.badge.wa:hover{text-decoration:none;background:rgba(62,207,142,.24)}
  .badge.tel{background:rgba(91,140,255,.14);color:var(--info);border:1px solid rgba(91,140,255,.35)}
  .badge.noc{background:rgba(255,255,255,.05);color:var(--ink-3);border:1px solid var(--line)}
  .badge.nocontact{background:var(--bad);color:#fff;border:1px solid var(--bad)}
  tr.nocontact{opacity:.6}
  tr.nocontact td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  td.notes textarea{width:100%;min-width:180px;height:40px;resize:vertical}
  .domainbox{margin-top:8px;padding:9px 10px;border:1px solid var(--accent);border-radius:8px;background:rgba(124,140,255,.07)}
  .domainlbl{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px}
  .domainbox .domain-in{width:100%;margin-bottom:6px}
  .domainbox .domst{width:100%}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.on{color:var(--ok)} .btn.off{color:var(--warn)}
  .btn.copied{color:var(--ok);border-color:var(--ok)}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .saved{color:var(--ok);font-size:11px;opacity:0;transition:opacity .2s}
  .saved.show{opacity:1}
  .days{font-variant-numeric:tabular-nums}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-2)}

  /* ── Modalità rapida: un lead alla volta, a schermo pieno ── */
  .qm-launch{background:var(--accent-2);color:#fff;border-color:var(--accent-2);font-weight:700}
  .qm-launch:hover{border-color:#fff}
  #quickMode{position:fixed;inset:0;z-index:9000;background:var(--bg);display:none;flex-direction:column}
  #quickMode.on{display:flex}
  .qm-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
  .qm-count{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
  .qm-exit{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 16px;min-height:44px;color:var(--ink);font-weight:600;cursor:pointer}
  .qm-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 40px;max-width:560px;width:100%;margin:0 auto}
  .qm-name{font-size:26px;font-weight:700;line-height:1.2;margin:0 0 6px;overflow-wrap:anywhere}
  .qm-city{color:var(--ink-2);font-size:15px;margin:0 0 2px}
  .qm-phone{font-size:18px;margin:10px 0 4px}
  .qm-phone a{color:var(--accent)}
  .qm-sect{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 9px}
  .qm-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin:0 0 10px}
  .qm-btn:active{transform:scale(.99)}
  .qm-btn.copied{color:var(--ok);border-color:var(--ok)}
  .qm-btn.wa{background:rgba(62,207,142,.14);color:var(--ok);border-color:rgba(62,207,142,.4)}
  .qm-btn.done{background:rgba(62,207,142,.16);color:var(--ok);border-color:rgba(62,207,142,.45)}
  .qm-btn.stop{background:rgba(255,107,107,.14);color:var(--bad);border-color:rgba(255,107,107,.4)}
  .qm-btn.skip{color:var(--ink-2)}
  .qm-close-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qm-close-row .qm-btn{margin:0}
  .qm-done{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--ink-2)}
  .qm-done .big{font-size:44px;margin-bottom:8px}

  /* ---- Mobile (<768px): la tabella diventa una lista di card verticali ---- */
  @media (max-width:768px){
    .wrap{padding:12px 12px 84px}
    table,thead,tbody,tr,td{display:block;width:100%}
    thead{display:none}
    table{font-size:14px}
    tbody tr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin:0 0 12px}
    tbody tr.nocontact{border-color:var(--bad)}
    tbody tr:hover{background:var(--panel)}
    tbody tr:has(td.empty){background:none;border:0;padding:0;margin:0}
    tbody td{border:0;padding:6px 0;vertical-align:middle}
    /* riga etichettata: etichetta a sinistra, valore a destra */
    tbody td[data-label]{display:flex;align-items:center;gap:12px;min-height:44px}
    tbody td[data-label]::before{content:attr(data-label);flex:0 0 40%;color:var(--ink-2);font-size:12px;font-weight:600}
    /* titolo = nome locale · sottotitolo = città */
    td.c-name{padding:0 0 2px}
    td.c-name .name{font-size:17px;line-height:1.25}
    td.c-name .sub{font-size:12px}
    td.c-city{padding:0 0 10px;margin:0 0 6px;border-bottom:1px solid var(--line);color:var(--ink-2);font-size:13px}
    /* controlli grandi tocco-friendly: etichetta sopra, controllo a tutta larghezza (≥44px) */
    tbody td.c-ctl{flex-direction:column;align-items:stretch;gap:5px}
    tbody td.c-ctl::before{flex:none}
    td.c-ctl select.status,td.c-ctl input[type=date]{width:100%;min-width:0;min-height:44px;font-size:15px;padding:9px 12px}
    td.c-ctl input[type=date]{-webkit-appearance:none;appearance:none;box-sizing:border-box;max-width:100%}
    td.c-ctl input[type=date]::-webkit-date-and-time-value{text-align:left}
    .domainbox .domain-in,.domainbox .domst{min-height:44px;font-size:16px}
    /* note: textarea espandibile */
    td.notes{display:block;padding:8px 0 4px}
    td.notes::before{content:"Note";display:block;color:var(--ink-2);font-size:12px;font-weight:600;margin:0 0 5px}
    td.notes textarea{width:100%;min-height:76px;height:auto;font-size:15px;padding:10px}
    /* azioni: griglia 2 colonne, ogni bottone ≥44px */
    td.c-actions{padding:10px 0 0;margin:8px 0 0;border-top:1px solid var(--line)}
    td.c-actions .actions{gap:8px}
    td.c-actions .actions>*{flex:1 1 calc(50% - 4px);min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:10px 8px}
    /* header: ricerca e filtri sticky, a tutta larghezza (16px = niente zoom iOS) */
    header{padding:10px 27px;gap:8px}   /* controlli allineati al CONTENUTO card: 12(.wrap)+1(bordo)+14(padding tr)=27 — no margin (inaffidabile su sticky iOS) */
    header .sp{display:none}
    header a.btn{order:0}                             /* "← App" a sinistra (back-button) */
    header h1{order:1;font-size:15px}                 /* titolo accanto */
    #savedFlag{position:absolute;top:12px;right:12px;font-size:11px}  /* fuori dal flusso: non sballa la riga 1 */
    #count{order:4;flex:1 1 100%;font-size:11px}      /* conteggio: riga propria full width */
    #search{order:5}
    #filter{order:6}
    #channel{order:7}
    #search,#filter,#channel{flex:1 1 100%;width:100%;min-width:0;min-height:44px;font-size:16px}
    #quickStart{order:8;flex:1 1 100%;width:100%;min-height:48px;font-size:16px}
    td.c-name .name,td.c-name .sub{overflow-wrap:anywhere}
  }
</style>
</head>
<body>
<header>
  <h1>Brik · CRM prospect</h1>
  <span id="count" class="pill">…</span>
  <span id="savedFlag" class="saved">salvato ✓</span>
  <span class="sp"></span>
  <input id="search" class="search" type="search" placeholder="Cerca nome o città…" autocomplete="off" />
  <select id="filter">
    <option value="">Tutti gli stati</option>
    <option value="da_contattare">Da contattare</option>
    <option value="contattato">Contattato</option>
    <option value="interessato">Interessato</option>
    <option value="venduto">Venduto</option>
    <option value="non_contattare">⛔ Non contattare</option>
    <option value="scaduto">Scaduto</option>
    <option value="__expired">⚠︎ Scaduti (&gt;20gg)</option>
    <option value="__off">Spenti</option>
  </select>
  <select id="channel">
    <option value="">Tutti i canali</option>
    <option value="whatsapp">📱 WhatsApp (mobile)</option>
    <option value="telefono">☎ Telefono (fisso)</option>
    <option value="nessun_contatto">∅ Nessun contatto</option>
  </select>
  <button id="quickStart" class="btn qm-launch" type="button">▶ Modalità rapida</button>
  <a class="btn" href="/" target="_blank">← App</a>
</header>

<div class="wrap">
  <table>
    <thead><tr>
      <th data-sort="name">Attività</th>
      <th data-sort="city">Città</th>
      <th data-sort="phone" class="no-sort">Telefono</th>
      <th data-sort="status">Stato</th>
      <th data-sort="lastContact">Ultimo contatto</th>
      <th data-sort="daysLive">Online da</th>
      <th class="no-sort">Note</th>
      <th class="no-sort">Azioni</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">Caricamento…</td></tr></tbody>
  </table>
</div>

<script>
// ─── TESTI DEI MESSAGGI WHATSAPP — modifica qui (placeholder: {NOME_LOCALE} {URL_SITO} {URL_CHECKOUT}) ───
const MSG_TEMPLATES = {
  primo: `Ciao, siamo Brik — Atlantix, Milano.

Abbiamo preparato il nuovo sito di {NOME_LOCALE}. Puoi vederlo qui:
{URL_SITO}

Nessun impegno. Se non ti interessa rispondi STOP e non ti scriviamo più.`,
  prezzo: `99 € all'anno, tutto compreso: sito, dominio, pubblicazione, aggiornamenti e assistenza.

Qui i dettagli:
{URL_CHECKOUT}`,
};
// ────────────────────────────────────────────────────────────────────────────────────────────
function fillMsg(tpl, x){
  const site = x.url || ('https://' + x.slug + '.thebrik.it');
  return tpl.replace(/{NOME_LOCALE}/g, x.name || '').replace(/{URL_SITO}/g, site).replace(/{URL_CHECKOUT}/g, 'https://thebrik.it/offerta?site=' + x.slug);
}
async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch(e){}
  try { // fallback (mobile / contesti non-secure): textarea + execCommand
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch(e){}
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(e){ return false; }
}
const STATUSES = ['da_contattare','contattato','interessato','venduto','non_contattare','scaduto'];
const LABEL = {da_contattare:'Da contattare',contattato:'Contattato',interessato:'Interessato',venduto:'Venduto',non_contattare:'⛔ Non contattare',scaduto:'Scaduto'};
const DOMSTATUSES = ['da_proporre','proposto','registrato','attivo'];
const DOMLABEL = {da_proporre:'Da proporre',proposto:'Proposto',registrato:'Registrato',attivo:'Attivo'};
let ALL = [];
let sortKey = 'name', sortDir = 1;

const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (s) => document.querySelector(s);

async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'content-type':'application/json'}, body: body?JSON.stringify(body):undefined});
  return r.json().catch(()=>({ok:false}));
}
function flashSaved(){ const f=$('#savedFlag'); f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),900); }

async function load(){
  const r = await api('GET','/api/crm/rows');
  if(!r.ok){ $('#rows').innerHTML = '<tr><td colspan="8" class="empty">Accesso negato o errore.</td></tr>'; return; }
  if(!r.ready){ $('#rows').innerHTML = '<tr><td colspan="8" class="empty">CRM non ancora inizializzato (manca data/crm/index.json). Esegui l\'import.</td></tr>'; return; }
  ALL = r.rows; render();
  if(r.quick) startQuick({ persist:false, silent:true }); // preferenza per-utente: riapre la modalità rapida
}

function currentView(){
  const q = $('#search').value.trim().toLowerCase();
  const f = $('#filter').value;
  const ch = $('#channel').value;
  let rows = ALL.filter(x=>{
    if(q && !((x.name||'').toLowerCase().includes(q) || (x.city||'').toLowerCase().includes(q))) return false;
    if(ch && x.channel!==ch) return false;
    if(f==='__expired') return x.expired;
    if(f==='__off') return x.off;
    if(f) return x.status===f;
    return true;
  });
  rows.sort((a,b)=>{
    let A=a[sortKey], B=b[sortKey];
    if(sortKey==='daysLive'){ A=a.daysLive==null?-1:a.daysLive; B=b.daysLive==null?-1:b.daysLive; return (A-B)*sortDir; }
    A=(A==null?'':A).toString().toLowerCase(); B=(B==null?'':B).toString().toLowerCase();
    return A<B?-sortDir:A>B?sortDir:0;
  });
  return rows;
}

function chanBadge(x){
  if(x.channel==='whatsapp'){ const num=(x.phone||'').replace(/[^\d]/g,''); return ' <a class="badge wa" href="https://wa.me/'+num+'" target="_blank" rel="noopener">📱 WhatsApp</a>'; }
  if(x.channel==='telefono') return ' <span class="badge tel">☎ fisso</span>';
  return ' <span class="badge noc">∅ no contatto</span>';
}
function rowHtml(x){
  const statusSel = '<select class="status st-'+x.status+'" data-slug="'+esc(x.slug)+'" data-field="status">'
    + STATUSES.map(s=>'<option value="'+s+'"'+(s===x.status?' selected':'')+'>'+LABEL[s]+'</option>').join('') + '</select>';
  const expBadge = x.expired ? ' <span class="badge exp">scaduto '+x.daysLive+'gg</span>' : '';
  const offBadge = x.off ? ' <span class="badge spento">spento</span>' : '';
  const nocBadge = x.status==='non_contattare' ? ' <span class="badge nocontact">⛔ NON CONTATTARE</span>' : '';
  const days = x.daysLive==null ? '—' : (x.daysLive+' gg');
  const editHref = x.projectId ? '/?open='+encodeURIComponent(x.projectId) : '';
  const domainBox = x.status==='venduto'
    ? '<div class="domainbox"><div class="domainlbl">🌐 Dominio</div>'
      + '<input type="text" class="domain-in" data-slug="'+esc(x.slug)+'" data-field="domain" value="'+esc(x.domain||'')+'" placeholder="es. ristoranteasia.it">'
      + '<select class="domst" data-slug="'+esc(x.slug)+'" data-field="domainStatus">'
      + DOMSTATUSES.map(s=>'<option value="'+s+'"'+(((x.domainStatus||'da_proporre')===s)?' selected':'')+'>'+DOMLABEL[s]+'</option>').join('')
      + '</select></div>'
    : '';
  return '<tr class="'+[x.off?'off':'', x.status==='non_contattare'?'nocontact':''].filter(Boolean).join(' ')+'" data-slug="'+esc(x.slug)+'">'
    + '<td class="c-name"><div class="name">'+esc(x.name)+nocBadge+offBadge+'</div><div class="sub"><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.slug)+'</a></div></td>'
    + '<td class="c-city">'+esc(x.city)+'</td>'
    + '<td data-label="Telefono">'+(x.phone?'<a href="tel:'+esc(x.phone.replace(/\s+/g,''))+'">'+esc(x.phone)+'</a>':'—')+chanBadge(x)+'</td>'
    + '<td class="c-ctl" data-label="Stato">'+statusSel+'</td>'
    + '<td class="c-ctl" data-label="Ultimo contatto"><input type="date" data-slug="'+esc(x.slug)+'" data-field="lastContact" value="'+esc(x.lastContact)+'"></td>'
    + '<td class="days" data-label="Online da">'+days+expBadge+'</td>'
    + '<td class="notes"><textarea data-slug="'+esc(x.slug)+'" data-field="notes" placeholder="Note del cliente…">'+esc(x.notes)+'</textarea>'+domainBox+'</td>'
    + '<td class="c-actions"><div class="actions">'
      + '<button class="btn" data-copy="primo" data-slug="'+esc(x.slug)+'">Copia 1° messaggio</button>'
      + '<button class="btn" data-copy="prezzo" data-slug="'+esc(x.slug)+'">Copia msg prezzo</button>'
      + '<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener">Apri sito</a>'
      + '<a class="btn" href="https://thebrik.it/preview/'+encodeURIComponent(x.slug)+'.png" target="_blank" rel="noopener">Anteprima</a>'
      + (editHref?'<a class="btn" href="'+editHref+'" target="_blank">Modifica</a>':'<span class="btn" style="opacity:.4">Modifica</span>')
      + '<a class="btn" href="/offerta?site='+encodeURIComponent(x.slug)+'" target="_blank">Checkout</a>'
      + '<button class="btn '+(x.off?'off':'on')+'" data-toggle="'+esc(x.slug)+'" data-off="'+(x.off?'1':'0')+'">'+(x.off?'Riaccendi':'Spegni')+'</button>'
    + '</div></td>'
  + '</tr>';
}

function render(){
  const rows = currentView();
  const exp = ALL.filter(x=>x.expired).length, off = ALL.filter(x=>x.off).length;
  const wa = ALL.filter(x=>x.channel==='whatsapp').length;
  $('#count').textContent = rows.length+' / '+ALL.length+' · 📱 '+wa+' WhatsApp · '+exp+' scaduti · '+off+' spenti';
  $('#rows').innerHTML = rows.length ? rows.map(rowHtml).join('') : '<tr><td colspan="8" class="empty">Nessun risultato.</td></tr>';
}

// --- eventi ---
$('#search').addEventListener('input', render);
$('#filter').addEventListener('change', render);
$('#channel').addEventListener('change', render);
document.querySelectorAll('thead th[data-sort]').forEach(th=>{
  if(th.classList.contains('no-sort')) return;
  th.addEventListener('click', ()=>{ const k=th.getAttribute('data-sort'); if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=1;} render(); });
});

function findRow(slug){ return ALL.find(x=>x.slug===slug); }

// change su status / date (delegato)
$('#rows').addEventListener('change', async (e)=>{
  const el = e.target;
  const slug = el.getAttribute('data-slug'); const field = el.getAttribute('data-field');
  if(!slug || !field) return;
  const val = el.value;
  const r = await api('POST','/api/crm/row/'+encodeURIComponent(slug), {[field]: val});
  if(r.ok){ const row=findRow(slug); if(row){ row[field]=val; if(field==='status'){ el.className='status st-'+val; // ricalcola expired lato client (grezzo: >20gg e non venduto)
        row.expired = row.daysLive!=null && row.daysLive>20 && val!=='venduto' && val!=='non_contattare'; render(); } } flashSaved(); }
});
// blur su note
$('#rows').addEventListener('focusout', async (e)=>{
  const el = e.target; if(el.tagName!=='TEXTAREA') return;
  const slug = el.getAttribute('data-slug'); const row=findRow(slug);
  if(!row || row.notes===el.value) return;
  const r = await api('POST','/api/crm/row/'+encodeURIComponent(slug), {notes: el.value});
  if(r.ok){ row.notes = el.value; flashSaved(); }
});
// copia messaggio WhatsApp negli appunti (delegato)
$('#rows').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-copy]'); if(!btn) return;
  const row = findRow(btn.getAttribute('data-slug')); const tpl = MSG_TEMPLATES[btn.getAttribute('data-copy')];
  if(!row || !tpl) return;
  const prev = btn.textContent;
  const ok = await copyText(fillMsg(tpl, row));
  btn.textContent = ok ? 'Copiato ✓' : 'Copia non riuscita';
  btn.classList.toggle('copied', ok);
  setTimeout(()=>{ btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
});
// spegni/riaccendi (delegato)
$('#rows').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-toggle]'); if(!btn) return;
  const slug = btn.getAttribute('data-toggle'); const off = btn.getAttribute('data-off')==='1';
  btn.disabled=true;
  const r = await api('POST','/api/crm/toggle/'+encodeURIComponent(slug), {off: !off});
  btn.disabled=false;
  if(r.ok){ const row=findRow(slug); if(row){ row.off=r.off; render(); } flashSaved(); }
  else alert((r.error&&r.error.message)||'Errore');
});

// ── Modalità rapida: un lead alla volta, a schermo pieno. Preferenza salvata per-utente (server). ──
let quickList = [], quickIdx = 0;
function saveQuickPref(on){ try { api('POST','/api/crm/prefs',{quick:!!on}); } catch(e){} }
function todayISO(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function ensureQuickDom(){
  if(document.getElementById('quickMode')) return;
  const d = document.createElement('div');
  d.id = 'quickMode';
  d.innerHTML = '<div class="qm-top"><span class="qm-count" id="qmCount"></span><button class="qm-exit" data-qm="exit" type="button">Esci</button></div><div class="qm-body" id="qmBody"></div>';
  document.body.appendChild(d);
  d.addEventListener('click', onQuickClick);
}
function startQuick(opts){
  opts = opts || {};
  quickList = currentView(); quickIdx = 0;
  if(!quickList.length){ if(!opts.silent) alert('Nessun lead con i filtri attivi.'); return; }
  if(opts.persist!==false) saveQuickPref(true);
  ensureQuickDom();
  document.getElementById('quickMode').classList.add('on');
  document.body.style.overflow = 'hidden';
  renderQuick();
}
function exitQuick(){
  saveQuickPref(false);
  const d = document.getElementById('quickMode'); if(d) d.classList.remove('on');
  document.body.style.overflow = '';
  render(); // riflette nella lista i cambi di stato fatti in modalità rapida
}
function renderQuick(){
  const body = document.getElementById('qmBody'), count = document.getElementById('qmCount');
  if(quickIdx >= quickList.length){
    count.textContent = quickList.length+' / '+quickList.length;
    body.innerHTML = '<div class="qm-done"><div><div class="big">✓</div><p>Fatti tutti i '+quickList.length+' lead.</p><button class="qm-btn done" data-qm="exit" type="button">Torna alla lista</button></div></div>';
    return;
  }
  const x = quickList[quickIdx];
  count.textContent = (quickIdx+1)+' / '+quickList.length;
  const num = (x.phone||'').replace(/[^\d]/g,'');
  const phone = x.phone ? '<a href="tel:'+esc(x.phone.replace(/\s+/g,''))+'">'+esc(x.phone)+'</a>' : '—';
  body.innerHTML =
    '<div class="qm-name">'+esc(x.name)+'</div>'
    + '<div class="qm-city">'+esc(x.city||'—')+'</div>'
    + '<div class="qm-phone">'+phone+'</div>'
    + '<div class="qm-sect">Messaggi</div>'
    + '<button class="qm-btn" data-qm="copy" data-tpl="primo" type="button">Copia messaggio</button>'
    + '<button class="qm-btn" data-qm="copy" data-tpl="prezzo" type="button">Copia msg prezzo</button>'
    + '<div class="qm-sect">Contatta</div>'
    + '<button class="qm-btn" data-qm="preview" type="button">Anteprima</button>'
    + (num ? '<button class="qm-btn wa" data-qm="wa" type="button">WhatsApp</button>' : '')
    + '<div class="qm-sect">Chiudi e vai al prossimo</div>'
    + '<button class="qm-btn done" data-qm="contattato" type="button">✓ Contattato</button>'
    + '<div class="qm-close-row"><button class="qm-btn stop" data-qm="noncontattare" type="button">⛔ Non contattare</button><button class="qm-btn skip" data-qm="salta" type="button">⏭ Salta</button></div>';
}
async function onQuickClick(e){
  const b = e.target.closest('[data-qm]'); if(!b) return;
  const act = b.getAttribute('data-qm');
  if(act==='exit'){ exitQuick(); return; }
  const x = quickList[quickIdx]; if(!x) return;
  if(act==='copy'){
    const tpl = MSG_TEMPLATES[b.getAttribute('data-tpl')]; if(!tpl) return;
    const prev = b.textContent, ok = await copyText(fillMsg(tpl, x));
    b.textContent = ok ? 'Copiato ✓' : 'Copia non riuscita'; b.classList.toggle('copied', ok);
    setTimeout(()=>{ b.textContent = prev; b.classList.remove('copied'); }, 1400);
    return;
  }
  if(act==='preview'){ window.open('https://thebrik.it/preview/'+encodeURIComponent(x.slug)+'.png','_blank'); return; }
  if(act==='wa'){ window.open('https://wa.me/'+(x.phone||'').replace(/[^\d]/g,''),'_blank'); return; }
  if(act==='salta'){ quickIdx++; renderQuick(); return; }
  if(act==='contattato' || act==='noncontattare'){
    const status = act==='contattato' ? 'contattato' : 'non_contattare';
    const patch = act==='contattato' ? { status, lastContact: todayISO() } : { status };
    b.disabled = true;
    const r = await api('POST','/api/crm/row/'+encodeURIComponent(x.slug), patch);
    b.disabled = false;
    if(r && r.ok){
      const row = findRow(x.slug);
      if(row){ row.status = status; if(patch.lastContact) row.lastContact = patch.lastContact; row.expired = row.daysLive!=null && row.daysLive>20 && status!=='venduto' && status!=='non_contattare'; }
      quickIdx++; renderQuick();
    } else { alert((r&&r.error&&r.error.message)||'Errore salvataggio'); }
  }
}
$('#quickStart').addEventListener('click', ()=>startQuick());

load();
</script>
